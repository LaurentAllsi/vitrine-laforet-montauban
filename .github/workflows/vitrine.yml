name: Vitrine Laforêt Montauban

# Régénère la présentation depuis laforet.com/montauban puis la publie sur GitHub Pages.
on:
  schedule:
    - cron: "30 4 * * *"    # ~6h30 (Paris, été) / 5h30 (hiver)
    - cron: "30 12 * * *"   # ~14h30 / 13h30 : reprend les annonces publiées dans la matinée
  workflow_dispatch:         # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["instagram/**", "public/index.html", "generer.py", ".github/workflows/vitrine.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vitrine
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install segno pillow
      - name: Générer les données (annonces, photos, QR, horaires)
        run: python generer.py
      - name: Vérifier que la génération est complète
        run: |
          python - <<'PY'
          import json
          d = json.load(open("public/data.json", encoding="utf-8"))
          assert len(d["vente"]) >= 3 and len(d["louer"]) >= 3, "pas assez d'annonces : on ne publie pas"
          print("OK", len(d["vente"]), "ventes,", len(d["louer"]), "locations")
          PY
      - name: Enregistrer data.json (garde le dépôt actif)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || (git commit -m "Vitrine : mise à jour automatique" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
